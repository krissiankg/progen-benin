[build]
  # Site statique : aucun build (le package.json est celui du template Crafto).
  # Cette ligne prime sur la commande "npm run build" éventuellement saisie dans l'interface Netlify.
  command = "echo 'Site statique : pas de build'"
  publish = "."

# Empêche l'accès public aux fichiers de travail / sources
[[redirects]]
  from = "/_archive/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_build_progen.py"
  to = "/index.html"
  status = 404
  force = true
